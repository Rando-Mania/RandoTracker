<style>
    /* Loading Screen */

    @font-face {
    font-family: "PressStart2P";
    src: local('PressStart2P'),
         url('../shared/fonts/pressstart2p.woff2') format('woff2'),
	     url('../shared/fonts/pressstart2p.woff') format('woff');
}

.abs{
    position: absolute;
}
.loadscreen-contain, .two-loading{
    width: 1280px;
    height: 720px;
    color: #fff;
    text-align: center;
    animation: zoomIn .5s linear;
    z-index: 50;
    display: none;
    background-color: #000;
    background-image: url("images/overworld-shop-background.webp");
    background-size: cover;
    background-position: center;
}

.loadscreen-contain.show, .two-loading{
    display: block;
}

.loadscreen-contain.show{
    mask: linear-gradient(red 0 0) no-repeat center / 100%;
    animation: stepped-curtain 1s steps(16);
    display: block;
}

@keyframes stepped-curtain { 
    from {
        mask-size: 0;
    } 
}

.player-name{
   border: solid 2px var(--player-color);
}

@supports (corner-shape: notch){
    .loadscreen .player-name{
        corner-shape: notch;
        border-radius: 4px;
        corner: notch 4px;
    }
}

div:nth-child(1 of .player-name) {--player-color: #40ff00;}
div:nth-child(2 of .player-name) {--player-color: #f00;}

.player-name:has([player="1"]){anchor-name: --player-name-1;}
.player-name:has([player="2"]){anchor-name: --player-name-2;}

.loadscreen .player-winner{
    border: solid 2px;
    border-bottom: none;
    width: auto;
    clip-path: inset(0 0 3px 0);
    border-radius: 4px;
    corner-shape: notch;
    position-area: top center;
}

.loadscreen .player-winner[player="1"]{
    position-anchor: --player-name-1;
}
.loadscreen .player-winner[player="2"]{
    position-anchor: --player-name-2;
}

.loadscreen .player-winner:before, .loadscreen .player-winner:after{
    content: '';
    width: 32px;
    aspect-ratio: 1;
    background-image: url(images/link-zelda-winner.png);
    background-size: cover;
    margin: 0 1em;
}

.loadscreen .player-winner:after{background-position: right;}

.loadscreen{
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    align-content: space-between;
    gap: 2em;
    place-items: center;
}

.loadscreen-main{
    height: 100%;
    width: 100%;
    position: relative;
    padding: 103px 161px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.loadscreen-main *{
    justify-content: center;
}    

.loadscreen-main .header{
    font: normal 42px 'PressStart2P', Arial, Helvetica, sans-serif;
    border: none;
    font-size: 1.5em;
}

.flame-npc-contain{
    display: flex;
    gap: 160px;
}

.flame{
    animation: flicker .25s infinite steps(1);
}

@keyframes flicker {
    50%{transform: rotateY(180deg);}
}

.npc{
    object-fit: cover;
    object-position: 0 0;
    object-position: random(-1120px, 0px, 80px) 0px;
    animation: --cloud 2s steps(1);
}

@keyframes --cloud {
    from{object-position: -1200px 0px;}
    to{object-position: auto;}
}

h2{
    display: flex;
    gap: 16px;
    align-items: center;
}
.loadscreen-main .player-name{
    font: normal 24px 'PressStart2P', Arial, Helvetica, sans-serif;
}

.loadscreen-main .load-vs{
    font: normal 42px 'PressStart2P', Arial, Helvetica, sans-serif;
}

.load-best-of.best-of-no, .loadscreen .best-of-3, .loadscreen .best-of-5, .loadscreen .best-of-7{
    display: none;
}
.load-best-of.best-of-3, .load-best-of.best-of-3 > .best-of-3{display: block;}
.load-best-of.best-of-5, .load-best-of.best-of-5 > .best-of-5{display: block;}
.load-best-of.best-of-7, .load-best-of.best-of-7 > .best-of-7{display: block;}

</style>
<div class="loadscreen">
    <div class="loadscreen-main">
        <tr-text property="header" class="header"></tr-text>
        <div class="flame-npc-contain">
            <img class="flame" width="80" src="images/zelda-flame.png" alt="flame">
            <img class="npc" width="80" height="80" src="images/random-character-sprite.webp" alt="npc">
            <img class="flame" width="80" src="images/zelda-flame.png" alt="flame">
        </div>
        <picture>
            <source srcset="images/RandoLogo.avif" type="image/avif">
            <source srcset="images/RandoLogo.webp" type="image/webp">
            <img class="z1r-logo" width="400" src="images/RandoLogo.png" alt="Zelda 1 Randomizer">
        </picture>
        <h2>
            <div class="player-name">
                <tr-text player="1" scale-to-fit-x property="player-name"></tr-text>
            </div>
            <tr-toggle player="1" property="toggle-winner" class="abs player-winner border-background-3">
                <div><span>W</span><span>I</span><span>N</span><span>N</span><span>E</span><span>R</span></div>
            </tr-toggle>
            <div class="load-vs">VS</div>
            <div class="player-name">
                <tr-text player="2" scale-to-fit-x property="player-name"></tr-text>
            </div>
            <tr-toggle player="2" property="toggle-winner" class="abs player-winner border-background-3"> 
                <div><span>W</span><span>I</span><span>N</span><span>N</span><span>E</span><span>R</span></div>
            </tr-toggle>
        </h2>
        <div class="load-best-of">
            <p class="best-of-3">Best of 3</p>
            <p class="best-of-5">Best of 5</p>
            <p class="best-of-7">Best of 7</p>
        </div>
    </div>
</div>
