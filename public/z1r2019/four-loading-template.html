    <style>
        /* Loading Screen */

.loadscreen-contain, .four-loading{
    width: 1280px;
    height: 720px;
    background-color: #000;
    background-image: url("images/overworld-shop-background.webp");
    background-size: cover;
    background-position: center;
    color: #fff;
    text-align: center;
    z-index: 50;
    display: none;
    font: normal 18px Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-variant: small-caps;
}

.four-loading{
    display: block;
    position: relative;
}

.loadscreen-contain.show{
    mask: linear-gradient(red 0 0) no-repeat center / 100%;
    animation: stepped-curtain 1s steps(16);
    display: block;
}

@keyframes stepped-curtain { 
    from {
        mask-size: 0;
    } 
}

.loadscreen{
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    align-content: space-between;
    gap: 2em;
    place-items: center;
}

.loadscreen-main{
    height: 100%;
    width: 100%;
    padding: 103px 161px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.loadscreen-main *{
    justify-content: center;
}    

.loadscreen-main .player-name{
    font: normal 24px 'PressStart2P', Arial, Helvetica, sans-serif;
}    

.loadscreen-main .header{
    font: normal 42px 'PressStart2P', Arial, Helvetica, sans-serif;
    border: none;
    font-size: 1.5em;
}

.flame-npc-contain{
    display: flex;
    gap: 160px;
}

.flame{
    animation: flicker .25s infinite steps(1);
}

@keyframes flicker {
    50%{transform: rotateY(180deg);}
}

.npc{
    object-fit: cover;
    object-position: 0 0;
    object-position: random(-1120px, 0px, 80px) 0px;
}

h2{
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 16px;
    align-items: center;
}

.loadscreen .player-name, .loadscreen .player-winner{
   border: solid var(--border) var(--player-color);
   --notch-depth: 1.5px;
   --notch-depth-minus: calc(100% - var(--notch-depth));
   clip-path: polygon(0% var(--notch-depth), var(--notch-depth) var(--notch-depth), var(--notch-depth) 0%, var(--notch-depth-minus) 0%, var(--notch-depth-minus) var(--notch-depth), 100% var(--notch-depth), 100% var(--notch-depth-minus), var(--notch-depth-minus) var(--notch-depth-minus), var(--notch-depth-minus) 100%, var(--notch-depth) 100%, var(--notch-depth) var(--notch-depth-minus), 0% var(--notch-depth-minus));
}

.loadscreen-main .player-name{
    font: normal 24px 'PressStart2P', Arial, Helvetica, sans-serif;
}

.loadscreen-main .player-name{
   border: solid 3px var(--player-color); 
   --nameWidth: 390px;
}

div:nth-child(1 of .player-name) {--player-color: #40ff00;}
div:nth-child(2 of .player-name) {--player-color: #f00;}
div:nth-child(3 of .player-name) {--player-color: #ff0;}
div:nth-child(4 of .player-name) {--player-color: #0ff;}

.load-and{
    font-family: 'Times New Roman', Times, serif;
    margin: 1em auto;
    display: none;
}

.show-and .load-and{display: block;}
.show-and .load-vs{display: none;}

    </style>
    <div class="loadscreen">
        <div class="loadscreen-main">
            <tr-text property="header" class="header"></tr-text>
            <div class="flame-npc-contain">
                <img class="flame" width="80" src="images/zelda-flame.png" alt="flame">
                <img class="npc" width="80" height="80" src="images/random-character-sprite.webp" alt="npc">
                <img class="flame" width="80" src="images/zelda-flame.png" alt="flame">
            </div>
            <div>
                <picture>
                    <source srcset="images/RandoLogo.avif" type="image/avif">
                    <source srcset="images/RandoLogo.webp" type="image/webp">
                    <img width="400" class="z1r-logo" src="images/RandoLogo.png" alt="Zelda 1 Randomizer">
                </picture>
            </div>
            <h2>
                <div class="player-name">
                    <tr-text player="1" scale-to-fit-x property="player-name"></tr-text>
                </div>
                <!-- vs. -->
                <div class="player-name">
                    <tr-text player="2" scale-to-fit-x property="player-name"></tr-text>
                </div>
                <!-- <span class="load-and-vs">
                    <span class="load-vs">vs.</span>
                    <span class="load-and">and</span>
                </span> -->
                <div class="player-name">
                    <tr-text player="3" scale-to-fit-x property="player-name"></tr-text>
                </div>
                <!-- vs. -->
                <div class="player-name">
                    <tr-text player="4" scale-to-fit-x property="player-name"></tr-text>
                </div>
            </h2>
        </div>
    </div>
